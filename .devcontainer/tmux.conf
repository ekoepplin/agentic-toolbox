# ── Better defaults ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# True color through to Ghostty (and other RGB-capable terminals)
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on

# ── Mobile-friendly: bigger status bar, clear indicators ─────────
set -g status-position top
set -g status-style "bg=colour235,fg=colour136"
set -g status-left "#[fg=colour46,bold] #S "
set -g status-right "#[fg=colour245] %H:%M "

# ── Easier prefix for phone keyboards ────────────────────────────
# Default Ctrl+b works, but Ctrl+a is easier on phone keyboards
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Quick window switching ───────────────────────────────────────
bind -n M-Left  previous-window
bind -n M-Right next-window

# ── Reload config ────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"
