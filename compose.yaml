# The base's own workbench (issue #9): the base dogfoods itself as its own
# host project. A single service — the workbench — runs the base image and
# docks the base at its mirrored host path. The thin devcontainer wrapper
# (.devcontainer/devcontainer.json) opens VS Code into exactly this service.
#
#   make image              # build the base image first (issue #8)
#   docker compose up -d    # start the workbench (the dock step wires every
#                           # harness adapter on each start — issue #10)
#   ssh -p 2224 node@localhost
#
# BASE_PATH is this repo's absolute host path, mounted at the same path in the
# container (ADR-0004). Defaults to ~/repos/agentic-toolbox; export BASE_PATH
# if you cloned elsewhere.
#
# `image` must stay the Makefile's canonical BASE_IMAGE (agentic-toolbox-base:latest).

services:
  workbench:
    image: agentic-toolbox-base:latest

    # The host project's code lives at the container's working directory —
    # here that is the base itself, at its mirrored host path.
    working_dir: ${BASE_PATH:-${HOME}/repos/agentic-toolbox}

    volumes:
      # Docked base, at its mirrored host path.
      - ${BASE_PATH:-${HOME}/repos/agentic-toolbox}:${BASE_PATH:-${HOME}/repos/agentic-toolbox}
      # Host Claude config (settings, sessions, memory).
      - ${HOME}/.claude:/home/node/.claude
      # Staged read-only; the dock step seeds /home/node/.claude.json from it
      # (avoids racing with the Mac's Claude Code).
      - ${HOME}/.claude.json:/tmp/claude.json.host:ro
      # Staged SSH authorized_keys; the dock step syncs it into
      # /home/node/.ssh/ (the bind mount has wrong ownership for sshd).
      - ${HOME}/.ssh/container_authorized_keys:/tmp/container_authorized_keys
      # Agent logs + scratch space (survive container rebuilds).
      - ${HOME}/agent-logs:/home/node/agent-logs:cached
      - ${HOME}/agent-work:/home/node/agent-work
      # Host Docker socket (docker-outside-of-docker) — lets the
      # in-container docker CLI talk to the host daemon (e.g. `vercel dev`
      # container builds). fix-docker-socket.sh (dock.sh) matches the gid.
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      # SSH on all interfaces so Tailscale/mobile traffic reaches sshd.
      # 2224 is this project's published port (unique per project); sshd
      # inside the container listens on 2222.
      - "0.0.0.0:2224:2222"

    environment:
      # Optional bot identity for pi + claude (see .devcontainer/as-bot.sh;
      # PI_* is the older name, still honoured); passed through from the
      # host only when set there.
      - BOT_GIT_USER
      - BOT_GIT_EMAIL
      - BOT_GH_TOKEN
      - PI_GIT_USER
      - PI_GIT_EMAIL
      - PI_GH_TOKEN

    extra_hosts:
      # Local LLM endpoints sit on the host's loopback and are reached via
      # host.docker.internal.
      - "host.docker.internal:host-gateway"

    # Keep the container alive. sshd starts on every start (replaces the old
    # devcontainer's postStartCommand); the dock step (issue #10) wires the
    # docked base into every supported harness on every start — not just
    # first creation. A dock failure is visible in the logs and retried on
    # the next start; it never takes the workbench down.
    command: ["/bin/sh", "-c", "sudo /usr/sbin/sshd; ${BASE_PATH:-${HOME}/repos/agentic-toolbox}/.devcontainer/scripts/dock.sh || echo 'dock: step FAILED — workbench stays up, re-run .devcontainer/scripts/dock.sh manually'; exec sleep infinity"]
